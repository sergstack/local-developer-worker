profile = "minimal"
# network_access denies outbound network access to external hosts/APIs.
# Loopback-only calls (127.0.0.1, ::1) for local model inference are exempt:
# they never leave the machine, resolve no DNS, and route nowhere external.
# Binding to 0.0.0.0 or any non-loopback address remains prohibited
# regardless of this exemption.
network_access = false
automatic_edit = false
automatic_commit = false
automatic_merge = false
production_deploy = false

[automatic]
structured_log_parser = true
test_result_parser = true
git_facts_collector = true
file_inventory = true
context_packer = true
change_summarizer_facts_only = true

[semantic]
enabled = false
code_artifact = "disabled"

[limits]
max_log_size_mb = 20
max_context_files = 20
timeout_seconds = 60

[security]
allowed_repository_roots = ["."]

[fallback]
on_timeout = "codex"
on_invalid_schema = "codex"
on_policy_violation = "codex"
on_internal_error = "codex"
